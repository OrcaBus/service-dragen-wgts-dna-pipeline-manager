name: Pull Request Tests

on:
  merge_group:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - auto_merge_enabled
    branches:
      - main

permissions: read-all

# Actions Used (please keep this documented here as added)
#  https://github.com/marketplace/actions/checkout
#  https://github.com/marketplace/actions/setup-python
#  https://github.com/marketplace/actions/trufflehog-oss
#  https://github.com/marketplace/actions/checkout
#  https://github.com/marketplace/actions/cache
#  https://github.com/actions-rust-lang/setup-rust-toolchain
#  https://github.com/dorny/paths-filter

jobs:
  pre-commit-lint-security:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - run: corepack enable

      - name: Print toolchain versions
        run: |
          node -v
          python3 -V
          pip3 -V
          make --version

      # TODO see whether we can leverage https://github.com/pre-commit/action
      - name: Install system-wide tools dependencies
        run: |
          pip3 install pre-commit detect-secrets black ggshield

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.34.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Install dependencies
        run: |
          make install

      - name: Lint and code formatting
        run: |
          make check

  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.sh'
              - '**/*.py'
              - '**/package.json'
              - '**/pnpm-lock.yaml'
              - 'infrastructure/**'
              - 'app/**'
              - 'test/**'
              - 'Makefile'
              - '.github/**'
  test-iac:
    runs-on: ubuntu-22.04-arm
    # Template service base is broken with
    if: >-
      !github.event.pull_request.draft &&
      github.repository != 'OrcaBus/template-service-base' &&
      needs.check-changes.outputs.should_test == 'true'
    needs: check-changes
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - run: corepack enable

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm test

  # This is the job you set as "required" in branch protection
  ci-gate:
    runs-on: ubuntu-latest
    needs: test-iac
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.test-iac.result }}" == "failure" ]]; then
            echo "Tests failed"
            exit 1
          fi
          echo "CI passed (tests passed or were skipped)"
